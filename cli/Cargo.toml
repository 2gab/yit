[package]
name = "yit"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
open = "5"
urlencoding = "2"
serde_json = "1"
url = "2"
